name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tabeeby
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tabeeby" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tabeeby:ci-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests (real PostgreSQL)
        run: npm run test:integration
      - name: Browser tests
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Build
        run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t tabeeby-app:ci .
