# Single-server production stack: PostgreSQL + app + Caddy (automatic HTTPS).
# Usage (on the server, from the repo root):
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d --build
# See docs/DEPLOY.md before the first run.

name: tabeeby

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: tabeeby
      POSTGRES_DB: tabeeby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabeeby -d tabeeby"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host: only the app can reach it.
    networks: [internal]

  migrate:
    build: { context: .., dockerfile: Dockerfile }
    image: tabeeby-app:latest
    command: ["node", "dist/scripts/migrate.js"]
    env_file: ../.env.production
    environment:
      DATABASE_URL: postgres://tabeeby:${POSTGRES_PASSWORD}@db:5432/tabeeby
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    restart: "no"

  app:
    image: tabeeby-app:latest
    command: ["node", "dist/src/server.js"]   # migrations run in the 'migrate' service
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      TRUST_PROXY: "true"
      DATABASE_URL: postgres://tabeeby:${POSTGRES_PASSWORD}@db:5432/tabeeby
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [internal]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  internal:
