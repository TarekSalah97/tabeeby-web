# Render Blueprint — Tabeeby web app on Render's free plan, database on Neon (free).
#
# Render dashboard → New → Blueprint → pick this repository → paste DATABASE_URL
# (Neon connection string, with ?sslmode=require) and the ADMIN_* values → Apply.
#
# Free-plan limits: the app sleeps after ~15 idle minutes (first visit then takes
# about a minute). No SMS provider yet (SMS_PROVIDER=none): phone numbers are not
# verified and no confirmations or reminders are sent. See docs/DEPLOY.md.

services:
  - type: web
    name: tabeeby
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    # The image's start script applies migrations, creates the admin from ADMIN_* if set, then starts.
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: SMS_PROVIDER
        value: none
      - key: STORAGE_DRIVER
        value: db
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
